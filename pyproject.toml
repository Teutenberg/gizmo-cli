[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "gizmo"
version = "0.1.0"
description = "A simple gizmo CLI"
requires-python = ">=3.12"
dependencies = ["click", "pyyaml", "jinja2", "cryptography", "keyring"]

[project.scripts]
gizmo = "gizmo.cli:cli"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

